# CodeRabbit settings for FoundryVTT-exploration-mode.
# Shared rules come from the central dxcufgb/coderabbit repository (inheritance: true), and CodeRabbit reads
# the README as code guidelines. Only what is specific to this repository is here.
# Paths here must not repeat a central path (scripts/**/*.js, .github/workflows/**, **/*.sh, **/*.ps1, **/*.iss,
# module.json, **/*.md): an entry with the same path replaces the central one instead of adding to it.
# Check the merged result on a pull request with: @coderabbitai configuration
inheritance: true

reviews:
  path_instructions:
    - path: "scripts/**"
      instructions: |
        The movement limit runs in preMoveToken on the client that moves the token, so it must work without a GM
        online and must never throw out of the hook (log and let the move through). A move is only cut by
        returning false and re-issuing a shorter move flagged with the module's ignoreLimit option, so a re-issued
        move can never be checked again. The scene flag "state" is written only by the responsible GM; players
        write only their own token's "dash" flag, and only as dot-path updates. Flag names, API members, hook
        names and the ignoreLimit move option are used by other modules and must never be renamed.
    - path: "tests/**"
      instructions: |
        Plain node:test files run by CI through .github/foundry-module.json ("lint"). They must not need Foundry.
    - path: ".github/workflows/{ci,release}.yml"
      instructions: |
        Thin callers of dxcufgb/foundry-module-ci, identical in every Foundry module repository. Flag any change
        here that is not the same change in all modules (it belongs in foundry-module-ci instead), except the
        pinned SHA of foundry-module-ci itself.
